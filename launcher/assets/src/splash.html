<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Orbitron; font-weight: 900; src: url('../../../node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: Orbitron; font-weight: 600; src: url('../../../node_modules/@fontsource/orbitron/files/orbitron-latin-600-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 720px; height: 405px; overflow: hidden; background: #05050f; }
  .frame { position: relative; width: 720px; height: 405px; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 55% at 22% 30%, rgba(122, 40, 160, 0.55), transparent 70%),
      radial-gradient(ellipse 55% 60% at 80% 26%, rgba(20, 110, 150, 0.5), transparent 70%),
      radial-gradient(ellipse 40% 40% at 55% 60%, rgba(90, 18, 80, 0.45), transparent 70%),
      linear-gradient(180deg, #04040c 0%, #0a0820 60%, #0d1030 100%); }
  .stars { position: absolute; inset: 0; }
  .planet { position: absolute; left: 50%; top: 312px; width: 2200px; height: 900px; margin-left: -1100px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0%, #1a1e44 0%, #0b0d22 20%, #04050d 60%);
    box-shadow: 0 -2px 0 0 rgba(159, 252, 255, 0.85), 0 -10px 40px 4px rgba(95, 246, 255, 0.35), 0 -40px 120px 30px rgba(80, 140, 255, 0.15); }
  .shield { position: absolute; left: 50%; top: 250px; width: 1700px; height: 700px; margin-left: -850px; border-radius: 50%;
    border-top: 1.5px solid rgba(95, 246, 255, 0.55); box-shadow: 0 -6px 26px -6px rgba(95, 246, 255, 0.4);
    background: radial-gradient(ellipse at 50% 0%, rgba(95, 246, 255, 0.08), transparent 40%); }
  .bolt { position: absolute; left: 0; top: 0; width: 720px; height: 405px; }
  .logo-wrap { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .glow, .logo { font-family: Orbitron; font-weight: 900; font-size: 78px; letter-spacing: 0.08em; padding-left: 0.08em; line-height: 1; }
  .glow { position: absolute; left: 0; right: 0; color: #48d8ff; filter: blur(18px); opacity: 0.75; }
  .logo { position: relative; display: inline-block; color: transparent;
    background: linear-gradient(176deg, #ffffff 0%, #e6fdff 30%, #5ff6ff 58%, #7a5cff 88%); -webkit-background-clip: text; background-clip: text; }
  .tag { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-family: Orbitron; font-weight: 600;
    font-size: 11px; letter-spacing: 0.55em; padding-left: 0.55em; color: rgba(190, 200, 235, 0.75); }
  .edge { position: absolute; inset: 0; border: 1px solid rgba(95, 246, 255, 0.28); border-radius: 14px; }
</style>
</head>
<body>
<div class="frame">
  <canvas class="stars" id="stars" width="1440" height="810" style="width:720px;height:405px"></canvas>
  <svg class="bolt" viewBox="0 0 720 405">
    <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
    <g stroke="#b9dcff" fill="none" stroke-linejoin="round">
      <polyline filter="url(#g)" stroke-width="4" opacity="0.6" points="676,0 664,22 674,36 660,58 670,72 657,96"/>
      <polyline stroke-width="1.2" points="676,0 664,22 674,36 660,58 670,72 657,96"/>
      <polyline stroke-width="0.8" opacity="0.8" points="674,36 690,50 688,66"/>
      <polyline stroke-width="0.8" opacity="0.7" points="660,58 646,66 642,80"/>
    </g>
  </svg>
  <div class="shield"></div>
  <div class="planet"></div>
  <div class="logo-wrap"><div class="glow">KEYSTORM</div><div class="logo">KEYSTORM</div></div>
  <div class="tag">TYPE TO FIRE · DEFEND THE SPIRE</div>
  <div class="edge"></div>
</div>
<script>
  // Deterministic starfield so the art is reproducible.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const c = document.getElementById('stars').getContext('2d');
  c.scale(2, 2);
  const cols = ['#ffffff', '#cfe8ff', '#ffe9c9', '#d9d0ff', '#b8fbff'];
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 720, y = rnd() * 300, z = Math.pow(rnd(), 2.4);
    c.globalAlpha = 0.25 + z * 0.75;
    c.fillStyle = cols[Math.floor(rnd() * cols.length)];
    const s = 0.4 + z * 1.6;
    c.beginPath(); c.arc(x, y, s / 2, 0, Math.PI * 2); c.fill();
  }
</script>
</body>
</html>
