<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Rendered at several sizes by render-assets.cjs; ?size=N&simple=1 */
  html, body { margin: 0; background: transparent; }
  .icon { position: relative; width: var(--s); height: var(--s); }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="icon" id="icon">
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2a1a63"/>
      <stop offset="0.45" stop-color="#110c33"/>
      <stop offset="1" stop-color="#04040e"/>
    </radialGradient>
    <radialGradient id="nebA" cx="22%" cy="28%" r="45%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="82%" cy="40%" r="50%">
      <stop offset="0" stop-color="#1fb8d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1fb8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bffcff"/>
      <stop offset="0.65" stop-color="#5ff6ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ff6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ffcff" stop-opacity="1"/>
      <stop offset="1" stop-color="#5ff6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <g class="detail">
      <rect width="256" height="256" fill="url(#nebA)"/>
      <rect width="256" height="256" fill="url(#nebB)"/>
      <g fill="#fff">
        <circle cx="46" cy="58" r="1.6" opacity="0.8"/><circle cx="200" cy="44" r="2" opacity="0.9"/>
        <circle cx="214" cy="120" r="1.3" opacity="0.6"/><circle cx="36" cy="140" r="1.2" opacity="0.6"/>
        <circle cx="78" cy="30" r="1" opacity="0.5"/><circle cx="168" cy="82" r="1" opacity="0.5"/>
      </g>
      <!-- planet horizon + shield dome -->
      <ellipse cx="128" cy="372" rx="230" ry="160" fill="#0b0d22"/>
      <ellipse cx="128" cy="372" rx="230" ry="160" fill="none" stroke="url(#rim)" stroke-width="3" filter="url(#soft)"/>
      <ellipse cx="128" cy="372" rx="230" ry="160" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <!-- lightning bolt -->
    <path filter="url(#glow)" fill="url(#bolt)"
      d="M150 22 L74 138 L118 138 L96 234 L186 102 L140 102 L170 22 Z"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#5ff6ff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--s', (q.get('size') || 256) + 'px');
  if (q.get('simple')) {
    // Tiny sizes: drop scenery, fatten the glow so the bolt reads at 16px.
    document.querySelector('.detail').remove();
    document.querySelector('#glow feGaussianBlur').setAttribute('stdDeviation', '5');
  }
</script>
</body>
</html>
